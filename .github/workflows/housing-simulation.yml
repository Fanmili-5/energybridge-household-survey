name: Housing simulation construction

on:
  push:
    paths:
      - 'benchmark/housing_simulation/**'
      - '.github/workflows/housing-simulation.yml'
  pull_request:
    paths:
      - 'benchmark/housing_simulation/**'
      - '.github/workflows/housing-simulation.yml'

permissions:
  contents: read

jobs:
  public-construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r benchmark/housing_simulation/requirements.txt
      - run: python -B -m unittest benchmark.housing_simulation.test_pipeline
      - run: python -B -m benchmark.housing_simulation.verify_package
