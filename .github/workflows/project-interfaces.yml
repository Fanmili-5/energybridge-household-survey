name: Three-line v69 data interfaces
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmark/project/**'
      - 'benchmark/collector/**'
      - 'benchmark/ab_generation/**'
      - 'benchmark/family_generation/**'
      - '.github/workflows/project-interfaces.yml'
  pull_request:
    paths:
      - 'benchmark/project/**'
      - 'benchmark/collector/**'
      - 'benchmark/ab_generation/**'
      - 'benchmark/family_generation/**'
      - '.github/workflows/project-interfaces.yml'
permissions:
  contents: read
jobs:
  method-scope:
    runs-on: ubuntu-latest
    outputs:
      method_only: ${{ steps.scope.outputs.method_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/research_delivery/ci_scope.py
  static-interfaces:
    needs: method-scope
    if: needs.method-scope.outputs.method_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source_world
        name: Check whether source-world inputs changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/project/source_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r benchmark/housing_simulation/requirements.txt
      - run: python -B -m unittest benchmark.project.test_source_scope benchmark.project.test_project benchmark.project.test_reference_collection_release benchmark.project.test_reference_collection_physics benchmark.project.test_reference_physical_release benchmark.project.test_reference_repair benchmark.ab_generation.test_plan_only benchmark.family_generation.test_generation benchmark.family_generation.test_connection -v
      - run: python -B benchmark/collector/test_rounds.py -v
      - run: python -B -m benchmark.project.verify_package
      - run: python -B -m benchmark.project verify-questionnaire benchmark/project/examples/questionnaire
      - run: node benchmark/project/verify_display.js benchmark/project/examples/questionnaire
