name: Reference benchmark verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify-current-reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public versions, source hashes and 50/1000 provenance
        run: python -B benchmark/verify_publication.py
      - name: Offline anonymous collection and recovery protocol
        run: python -B benchmark/collector/test_protocol.py
      - name: Public proxy request bound and anonymous rejection contract
        run: python -B -m unittest deploy.test_reference50_body_capacity -v
      - name: Missing volume, wrong bind and recovery guard (no disk operations)
        run: python -B -m unittest deploy.test_reference50_data_mount -v
      - name: Tracked artifacts and credential signatures
        run: python -B scripts/check_secrets.py --history
