name: A-B ten-day collection plans
on:
  workflow_dispatch:
  pull_request:
    paths: ['benchmark/ab_generation/**', '.github/workflows/ab-collection-plan.yml']
  push:
    branches: [main]
    paths: ['benchmark/ab_generation/**', '.github/workflows/ab-collection-plan.yml']
permissions:
  contents: read
jobs:
  plan-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/ab_generation/collection-requirements.txt
      - run: python -B -m unittest benchmark.ab_generation.test_collection benchmark.ab_generation.test_generation benchmark.ab_generation.test_plan_only -v
      - name: Reproduce six source families, sixty independent daily plans; no engine
        run: |
          python -B -m benchmark.ab_generation.collection prepare-source --out "$RUNNER_TEMP/collection-A"
          python -B -m benchmark.ab_generation.collection build --source-project "$RUNNER_TEMP/collection-A" --out "$RUNNER_TEMP/collection-pilot"
          python -B -m benchmark.ab_generation.collection recheck --root "$RUNNER_TEMP/collection-pilot"
          python -B -m benchmark.ab_generation.collection replay --root "$RUNNER_TEMP/collection-pilot"
          python -B -m benchmark.ab_generation.validation.collection.baseline_audit --root "$RUNNER_TEMP/collection-pilot" --out "$RUNNER_TEMP/baseline-A-review.json"
          python -B -m benchmark.ab_generation.validation.collection.independent_review --root "$RUNNER_TEMP/collection-pilot" --out "$RUNNER_TEMP/independent-review.json"
          python -B -m benchmark.ab_generation.validation.collection.ev_windows --root "$RUNNER_TEMP/collection-pilot" --out "$RUNNER_TEMP/ev-windows-review.json"
