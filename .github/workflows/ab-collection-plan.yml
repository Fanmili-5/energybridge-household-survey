name: A-B ten-day collection plans
on:
  workflow_dispatch:
  pull_request:
    paths: ['benchmark/ab_generation/**', '.github/workflows/ab-collection-plan.yml']
  push:
    branches: [main]
    paths: ['benchmark/ab_generation/**', '.github/workflows/ab-collection-plan.yml']
permissions:
  contents: read
jobs:
  method-scope:
    runs-on: ubuntu-latest
    outputs:
      method_only: ${{ steps.scope.outputs.method_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/research_delivery/ci_scope.py
  plan-only:
    needs: method-scope
    if: needs.method-scope.outputs.method_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source_world
        name: Check whether source-world inputs changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/project/source_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/ab_generation/collection-requirements.txt
      - run: python -B -m unittest benchmark.ab_generation.test_collection benchmark.ab_generation.test_collection_selection benchmark.ab_generation.test_collection_semantics benchmark.ab_generation.validation.collection_v2.test_independent_logic benchmark.ab_generation.test_generation benchmark.ab_generation.test_plan_only -v
