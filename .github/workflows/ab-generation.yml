name: A-B strategy generation

on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmark/ab_generation/**'
      - 'benchmark/housing_simulation/**'
      - '.github/workflows/ab-generation.yml'
  pull_request:
    paths:
      - 'benchmark/ab_generation/**'
      - 'benchmark/housing_simulation/**'
      - '.github/workflows/ab-generation.yml'

permissions:
  contents: read

jobs:
  method-scope:
    runs-on: ubuntu-latest
    outputs:
      method_only: ${{ steps.scope.outputs.method_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/research_delivery/ci_scope.py
  public-reproduction:
    needs: method-scope
    if: needs.method-scope.outputs.method_only != 'true'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: source_world
        name: Check whether source-world inputs changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B benchmark/project/source_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B -m unittest benchmark.ab_generation.test_generation benchmark.ab_generation.test_life benchmark.ab_generation.test_review benchmark.ab_generation.test_sampling benchmark.ab_generation.test_opportunity benchmark.ab_generation.test_sensitivity benchmark.ab_generation.test_joint_load_supply benchmark.ab_generation.test_joint_tail benchmark.ab_generation.test_gap_review benchmark.ab_generation.test_static_sampling benchmark.ab_generation.test_plan_only -v
      - run: python -B -m benchmark.ab_generation.verify_package
      - name: Recheck frozen per-target coverage without selecting new B
        run: python -B -m benchmark.ab_generation.validation.self_check.recompute --out "${{ runner.temp }}/ab-self-check"
      - name: Reproduce without the historical cohort or other modules
        if: steps.source_world.outputs.rebuild == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ab-independent/benchmark"
          cp benchmark/__init__.py "$RUNNER_TEMP/ab-independent/benchmark/"
          cp -R benchmark/ab_generation "$RUNNER_TEMP/ab-independent/benchmark/"
          cd "$RUNNER_TEMP/ab-independent"
          python -B -m benchmark.ab_generation generate \
            --input benchmark/ab_generation/examples/batch.json \
            --rules benchmark/ab_generation/examples/rules.json \
            --out "$RUNNER_TEMP/ab-example"
          python -B -m benchmark.ab_generation verify "$RUNNER_TEMP/ab-example"
          python -B -m benchmark.ab_generation build-life \
            --input benchmark/ab_generation/examples/life/life_batch.json \
            --out "$RUNNER_TEMP/life-example"
          python -B -m benchmark.ab_generation verify "$RUNNER_TEMP/life-example"

  gap-static-check:
    needs: method-scope
    if: needs.method-scope.outputs.method_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check plan coverage and retained failures without simulation
        run: python -B -m benchmark.ab_generation.validation.gap_supplement.recompute --out "${{ runner.temp }}/gap-static-check"
      - name: Replay final frozen strata and audit all selected full plans without simulation
        run: python -B -m benchmark.ab_generation.static_sampling recheck --require-coverage --out "${{ runner.temp }}/final-static-sampling"

  paper-v1-contracts:
    needs: method-scope
    if: needs.method-scope.outputs.method_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EB_NATIVE_SOURCE: /tmp/eb-appliance-sim.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/ab_generation/unified/requirements-lock.txt
      - name: Prepare pinned public EB appliance source
        run: |
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          from benchmark.ab_generation.eb_primary import NATIVE_SHA
          url = "https://raw.githubusercontent.com/Agentic-Intelligence-Lab/EnergyBridge/c58a2a7a3189482f57b93ddd0637f2c58ce5b5d0/energybridge/simulation/appliance_sim.py"
          data = urllib.request.urlopen(url, timeout=45).read()
          assert hashlib.sha256(data).hexdigest() == NATIVE_SHA
          Path(os.environ["EB_NATIVE_SOURCE"]).write_bytes(data)
          PY
      - name: Check current native contracts without skipped replays
        run: |
          python -B - <<'PY'
          import unittest
          names = [
              "benchmark.ab_generation.test_eb_agent_contract",
              "benchmark.ab_generation.test_eb_alignment",
              "benchmark.ab_generation.test_daily_problem",
              "benchmark.ab_generation.test_cohort_coverage",
              "benchmark.ab_generation.unified.test_joint_order_selection",
              "benchmark.ab_generation.unified.test_input_boundaries",
              "benchmark.ab_generation.test_daily_services",
              "benchmark.ab_generation.test_v9_episode_contract",
              "benchmark.ab_generation.unified.test_household_entry",
              "benchmark.ab_generation.unified.test_selection_execution_gate",
          ]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
