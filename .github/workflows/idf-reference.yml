name: EB reference IDF source

on:
  push:
    paths:
      - 'benchmark/idf_reference/**'
      - '.github/workflows/idf-reference.yml'
  pull_request:
    paths:
      - 'benchmark/idf_reference/**'
      - '.github/workflows/idf-reference.yml'

permissions:
  contents: read

jobs:
  software-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmark/idf_reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Check published source and command semantics
        run: |
          python -B -m unittest discover -s tests -v
          python -B -m scripts.public_parameters catalog
      # These are software checks. Native physics runs require the separate
      # pinned public-source environment and retain their original criteria.
