name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_secrets.py
      - run: python scripts/bootstrap_upstream.py
      - run: bash scripts/install_energyplus_linux.sh "$RUNNER_TEMP/energyplus"
      - name: Backend and native EP regression without model APIs
        run: python scripts/test_offline.py
        env:
          EPLUS_ROOT: ${{ runner.temp }}/energyplus
          EB_TEST_NATIVE_EP: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.55.0
      - run: "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser mock regression
        run: |
          for test in realtime_pilot/deploy/verify*.js; do node "$test"; done
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
      - name: Native deployment template checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          bash scripts/check_deploy_linux.sh
