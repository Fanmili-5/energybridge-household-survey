name: Offline verification
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: offline-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      ab_only: ${{ steps.scope.outputs.ab_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Keep bounded A/B/project interface changes on static workflows
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          ab_only = False
          if os.environ['EVENT_NAME'] != 'workflow_dispatch':
              if not base or set(base) == {'0'}:
                  base = subprocess.check_output(['git', 'merge-base', 'HEAD',
                      'origin/' + os.environ['DEFAULT_BRANCH']], text=True).strip()
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              ancillary = {'benchmark/PUBLICATION_MANIFEST.json',
                           'benchmark/family_generation/PACKAGE_MANIFEST.json',
                           '.github/workflows/ab-generation.yml', '.github/workflows/ab-collection-plan.yml', '.github/workflows/offline-checks.yml',
                           '.github/workflows/project-interfaces.yml', 'README.md', 'THIRD_PARTY.md', 'benchmark/README.md',
                           'deploy/activate_reference50_ui91.py',
                           'benchmark/verify_publication.py', 'benchmark/DATASET_CARD.md',
                           'benchmark/COLLECTION.md', 'benchmark/EVALUATION.md',
                           'benchmark/GENERATION.md', 'benchmark/REPRODUCTION.md', 'benchmark/ACCEPTANCE.md',
                           'docs/household1000/STATUS.json', 'docs/household1000/CURRENT_QUESTIONNAIRE50.json',
                           'PROJECT.md', 'PROJECT_REVIEW_20261020.md', 'docs/README.md'}
              static_roots = ('benchmark/ab_generation/', 'benchmark/project/',
                              'benchmark/collector/', 'benchmark/releases/reference50-v1/runtime/',
                              'benchmark/releases/reference50-v4-ui91-complete/',
                              'benchmark/releases/reference50-v4-proposal/')
              ab_only = (bool(paths)
                         and all(p.startswith(static_roots) or p in ancillary
                                 or (p.startswith('benchmark/releases/reference50-v4-ui91-physics/')
                                     and p.endswith(('.json', '.md'))) for p in paths))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ab_only=' + str(ab_only).lower() + '\n')
          PY
  verify:
    needs: scope
    if: needs.scope.outputs.ab_only != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_secrets.py --history
      - run: python -m unittest discover -s scripts -p 'test_clean_collected_case.py'
      - name: Reviewed role HTTP, collection contract and SQL readers
        run: |
          python -m unittest realtime_pilot.test_role_ten_day_http -v
          python -m unittest discover -s docs/research/long-horizon-plan/execution/prelaunch_rigor_20260924/household_300_resolution_20260925/E_collection_release -p test_offline_collection_contract.py -v
          python -m unittest realtime_pilot.test_energyplus_sql_null_warmup -v
        env:
          PYTHONPATH: realtime_pilot
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Native deployment template checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          sudo bash scripts/check_deploy_linux.sh
      - run: python scripts/bootstrap_upstream.py
      - uses: actions/cache@v4
        with:
          path: simulation_resources/weather
          key: weather-${{ hashFiles('simulation_resources/catalog.json') }}
      - run: python scripts/bootstrap_resources.py
      - run: bash scripts/install_energyplus_linux.sh "$RUNNER_TEMP/energyplus"
      - name: Backend and native EP regression without model APIs
        run: python scripts/test_offline.py
        env:
          EPLUS_ROOT: ${{ runner.temp }}/energyplus
          EB_TEST_NATIVE_EP: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.55.0
      - run: "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright install --with-deps chromium"
      - name: Isolated role SVG browser regression without planning
        run: |
          set -euo pipefail
          python realtime_pilot/server.py --port 18768 --data-dir "$RUNNER_TEMP/role-preview-data" \
            --disable-planning --session-cookie-name eb_role_preview_session \
            >"$RUNNER_TEMP/role-preview-server.log" 2>&1 &
          role_pid=$!
          trap 'kill "$role_pid" 2>/dev/null || true; wait "$role_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if python -c 'import json,urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); d=json.load(o.open("http://127.0.0.1:18768/api/roles/session",timeout=2)); assert d.get("ready") is True and d.get("collection_mode")=="engineering_preview"' 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$role_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/role-preview-server.log"; exit 1; fi
          EB_BROWSER_ORIGIN=http://127.0.0.1:18768 node realtime_pilot/deploy/verify_role_svg.js
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Browser and actual collection regression (no paid API)
        run: |
          python scripts/test_frontend.py
          python scripts/test_frontend.py --human-mode --captcha
          python scripts/test_admin_frontend.py
          python scripts/test_report_frontend.py
          node realtime_pilot/deploy/verify_demo_entry.js
          node realtime_pilot/deploy/verify_frontend_recovery.js
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
          EPLUS_ROOT: ${{ runner.temp }}/energyplus
