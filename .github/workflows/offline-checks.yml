name: Offline verification
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: offline-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_secrets.py
      - name: Native deployment template checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          sudo bash scripts/check_deploy_linux.sh
      - run: python scripts/bootstrap_upstream.py
      - uses: actions/cache@v4
        with:
          path: simulation_resources/weather
          key: weather-${{ hashFiles('simulation_resources/catalog.json') }}
      - run: python scripts/bootstrap_resources.py
      - run: bash scripts/install_energyplus_linux.sh "$RUNNER_TEMP/energyplus"
      - name: Backend and native EP regression without model APIs
        run: python scripts/test_offline.py
        env:
          EPLUS_ROOT: ${{ runner.temp }}/energyplus
          EB_TEST_NATIVE_EP: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/browser-tests" playwright@1.55.0
      - run: "$RUNNER_TEMP/browser-tests/node_modules/.bin/playwright install --with-deps chromium"
      - name: Browser and actual collection regression (no paid API)
        run: |
          python scripts/test_frontend.py
          node realtime_pilot/deploy/verify_demo_entry.js
          node realtime_pilot/deploy/verify_frontend_recovery.js
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
          EPLUS_ROOT: ${{ runner.temp }}/energyplus
