<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭用电安排问卷</title><link rel="stylesheet" href="view.css"><script src="entry.js" defer></script></head>
<body><header class="site-header"><div class="header-inner"><span class="brand">EnergyBridge<span>家庭用电研究</span></span><span class="badge" id="collection-mode">家庭用电评价</span></div></header><main class="entry-page"><div class="entry-intro"><p class="eyebrow">ENERGYBRIDGE / 家庭用电研究</p><h1>安排变一点，<br>这户家庭会怎样选择？</h1><p class="intro">系统为你分配一户家庭，<br>按角色评价10个日期。完成后可自愿再评价另一户。</p><ol class="entry-steps"><li><span>01</span>了解家庭</li><li><span>02</span>比较A/B</li><li><span>03</span>选择、评分</li></ol></div><section class="panel entry-panel"><p class="eyebrow">开始之前</p><h2>参与这次评价</h2><p id="notice-text" class="section-note"></p><label class="consent-choice" id="consent-label"><input id="entry-consent" type="checkbox"><span>我已阅读说明，自愿参与，并理解需按给定家庭角色作答。</span></label><button id="start" type="button" disabled>开始填写</button><p id="entry-status" role="status"></p><div id="recovery-panel" hidden><p>请保存这一个恢复码，换设备或再次参加时继续使用；未完成会回到原进度，完成后可领取另一户。清除浏览记录后请用恢复码找回身份。</p><input id="recovery-code" aria-label="恢复码" readonly autocomplete="off"><button id="copy-recovery" class="secondary" type="button">复制恢复码</button><p><a id="continue-link">进入问卷 →</a></p></div><details><summary>已有恢复码？继续填写</summary><form id="recover-form"><label class="field" for="credential">恢复码<input id="credential" type="password" minlength="24" maxlength="100" autocomplete="off" required></label><button type="submit">恢复填写</button></form></details></section></main><footer>方案为参考仿真，不会改变现实电器的设置。</footer></body></html>
